<section class="card flex flex-col gap-10">
  <h1 class="font-bold text-[18pt]">{{ 'ADMIN.CENTRE.SETTINGS.OTHERS.TITLE' | translate }}</h1>

  <form
    class="max-w-sm flex flex-col gap-4"
    [formGroup]="form"
  >
    <div class="w-[15rem] flex flex-col gap-1">
      <p>{{ 'ADMIN.CENTRE.SETTINGS.OTHERS.VAT' | translate }}</p>
      <p-iconfield>
        <p-inputicon class="pi pi-money-bill"/>
        <p-inputnumber
          [min]="0"
          inputId="on_iva"
          autocomplete="off"
          class="w-full"
          formControlName="iva"
          placeholder="0,00 MT"
          suffix=" MT"
        />
      </p-iconfield>
    </div>

    <div class="w-[15rem] flex flex-col gap-1">
      <p>{{ 'ADMIN.CENTRE.SETTINGS.OTHERS.MINIMUM_STOCK' | translate }}</p>
      <p-iconfield>
        <p-inputicon class="pi pi-sitemap"/>
        <p-inputnumber
          [min]="0"
          inputId="on_stock"
          autocomplete="off"
          class="w-full"
          formControlName="stock"
          placeholder="0"
        />
      </p-iconfield>
    </div>
  </form>

  <p-divider style="margin: 0.5rem 0 0.5rem 0;"/>

  <article class="flex justify-end">
    <button pRipple type="button"
      class="btn_default btn_min-width"
      [disabled]="isLoading"
      (click)="onSubmit()"
    >
      @if (isLoading) {
        <div class="loader">
          <span class="small_loader"></span>
        </div>
      }
      @else {
        <i class="pi pi-save" style="font-size: 1rem"></i>
        <span>{{ 'COMMON.ACTIONS.SAVE' | translate }}</span>
      }
    </button>
  </article>
</section>
