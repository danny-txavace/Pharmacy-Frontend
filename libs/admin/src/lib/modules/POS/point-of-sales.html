<section class="w-full flex gap-7">
  <article class="pos w-150 mb-2 flex flex-col gap-7">
    <div class="flex justify-between items-center">
      <h2>{{ 'ADMIN.CENTRE.POS.LEFT.RECEIPT_NR' | translate }}</h2>
      <h2>0000032</h2>
    </div>

    <div class="flex flex-col gap-1">
      <div class="pos_card btn w-full space-y-5">
        <div>
          <span class="flex items-center justify-between">
            <h2>
              {{ 'ADMIN.CENTRE.POS.LEFT.PAYMENT.QTY' | translate }}
            </h2>
            <h3>0</h3>
          </span>
          <span class="flex items-center justify-between">
            <h2>
              {{ 'ADMIN.CENTRE.POS.LEFT.PAYMENT.TOTAL_TO_PAY' | translate }}
            </h2>
            <h3>0,00 MT</h3>
          </span>
        </div>

        <div class="w-full grid gap-2">
          <button pRipple type="button"
              class="btn_green w-full flex items-center justify-center gap-2 min-h-13 text-lg!"
            >
              <i class="pi pi-wallet"></i>
              <span>{{ 'ADMIN.CENTRE.POS.LEFT.PAYMENT.BTN.PAY_NOW' | translate }}</span>
            </button>
          <span class="w-full flex gap-2 items-center justify-between">
            <button pRipple type="button"
              class="btn_cancel min-h-13 !px-8 text-lg!"
            >
              {{ 'ADMIN.CENTRE.POS.LEFT.PAYMENT.BTN.CANCEL' | translate }}
            </button>
            <button pRipple type="button"
              class="btn_orange w-full flex items-center justify-center gap-2 min-h-13 text-lg!"
            >
              <i class="pi pi-cart-arrow-down"></i>
              <span>{{ 'ADMIN.CENTRE.POS.LEFT.PAYMENT.BTN.PAY_AFTER' | translate }}</span>
            </button>
          </span>
        </div>
      </div>
      <p class="text-end text-gray-400 text-sm">{{ 'ADMIN.CENTRE.POS.LEFT.VAT' | translate }}</p>
    </div>

    <p-divider style="margin-top: 0.5rem; margin-bottom: 0.5rem;"/>

    <p-panelmenu [model]="items" class="w-full" />
  </article>
  <article class="loader ag_grid w-full flex flex-col gap-3">
    <p-floatlabel variant="on" class="w-full">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input type="text" pInputText id="lbl_search" [(ngModel)]="searchInput" autocomplete="off" (input)="onSearch()" />
    </p-iconfield>
      <label for="lbl_search">
        {{ 'ADMIN.CENTRE.POS.RIGHT.SEARCH' | translate }}
      </label>
    </p-floatlabel>

    @if (!tableLoading)
    {
      <span class="w-full h-[40dvh] flex justify-center items-center">
        <span class="view_loader"></span>
      </span>
    }
    @else
    {
      <ag-grid-angular
        class="ag_theme_alpine w-full"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [animateRows]="true"
        [domLayout]="'autoHeight'"
        [pagination]="false"
        [headerHeight]="headerHeight"
        [rowHeight]="rowHeight"
        [rowSelection]="rowSelection"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    }
  </article>
</section>
